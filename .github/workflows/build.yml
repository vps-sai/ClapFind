name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ClapFind-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ClapFind-test.apk
          gh release view test-build >/dev/null 2>&1 || gh release create test-build --prerelease --title "ClapFind test build" --notes "Latest test build for trying on your own phone. Not the Play Store version."
          gh release upload test-build ClapFind-test.apk --clobber
