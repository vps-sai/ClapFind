plugins {
    id 'com.android.application'
}

android {
    namespace 'com.findbyclap.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.findbyclap.app'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No dependencies on purpose: the app uses only what is built into Android.
